<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" font-family="'Georgia','Times New Roman',serif">
  <defs>
    <marker id="cur" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0,0 L11,4.5 L0,9 Z" fill="#b03030"/>
    </marker>
  </defs>

  <!-- rails -->
  <line x1="20" y1="60" x2="50"  y2="60"  stroke="#3a5998" stroke-width="3"/>
  <line x1="20" y1="185" x2="560" y2="185" stroke="#3a5998" stroke-width="3"/>

  <!-- R Δz  (zigzag) -->
  <polyline points="50,60 58,60 63,50 73,70 83,50 93,70 103,50 110,60 120,60"
            fill="none" stroke="#3a5998" stroke-width="3"/>
  <text x="85" y="35" text-anchor="middle" font-size="17" fill="#3a5998"><tspan font-style="italic">R</tspan>Δz</text>

  <!-- L Δz  (coils) -->
  <path d="M120,60 q10,-18 20,0 q10,-18 20,0 q10,-18 20,0 q10,-18 20,0"
        fill="none" stroke="#3a5998" stroke-width="3"/>
  <text x="160" y="35" text-anchor="middle" font-size="17" fill="#3a5998"><tspan font-style="italic">L</tspan>Δz</text>

  <!-- wire to series node, with current arrow -->
  <line x1="200" y1="60" x2="300" y2="60" stroke="#3a5998" stroke-width="3"/>
  <line x1="232" y1="60" x2="282" y2="60" stroke="#b03030" stroke-width="5" marker-end="url(#cur)"/>
  <text x="255" y="48" text-anchor="middle" font-size="17" font-style="italic" fill="#b03030">I(z)</text>

  <!-- + / - terminals -->
  <text x="322" y="72" font-size="20" fill="#b03030">+</text>
  <text x="322" y="180" font-size="22" fill="#b03030">−</text>

  <!-- shunt branch 1: G Δz (vertical resistor) -->
  <line x1="330" y1="60" x2="330" y2="92" stroke="#3a5998" stroke-width="3"/>
  <polyline points="330,92 320,98 340,106 320,114 340,122 320,130 340,138 330,144"
            fill="none" stroke="#3a5998" stroke-width="3"/>
  <line x1="330" y1="144" x2="330" y2="185" stroke="#3a5998" stroke-width="3"/>
  <text x="300" y="110" text-anchor="middle" font-size="17" fill="#3a5998"><tspan font-style="italic">G</tspan>Δz</text>

  <!-- shunt branch 2: C Δz (capacitor) -->
  <line x1="430" y1="60" x2="430" y2="110" stroke="#3a5998" stroke-width="3"/>
  <line x1="410" y1="110" x2="450" y2="110" stroke="#3a5998" stroke-width="3"/>
  <line x1="410" y1="124" x2="450" y2="124" stroke="#3a5998" stroke-width="3"/>
  <line x1="430" y1="124" x2="430" y2="185" stroke="#3a5998" stroke-width="3"/>
  <text x="470" y="122" font-size="17" fill="#3a5998"><tspan font-style="italic">C</tspan>Δz</text>

  <!-- top rail node-to-node and output -->
  <line x1="300" y1="60" x2="330" y2="60" stroke="#3a5998" stroke-width="3"/>
  <line x1="330" y1="60" x2="560" y2="60" stroke="#3a5998" stroke-width="3"/>

  <!-- output terminals -->
  <circle cx="560" cy="60"  r="4" fill="#3a5998"/>
  <circle cx="560" cy="185" r="4" fill="#3a5998"/>
  <text x="540" y="128" text-anchor="middle" font-size="17" font-style="italic" fill="#3a5998">V(z)</text>
</svg>
