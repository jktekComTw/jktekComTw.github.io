<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Georgia','Times New Roman',serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">A simplified wireless receiver</text>

  <!-- Input Si, Ni -->
  <text x="30" y="148" font-size="16" font-style="italic" fill="#333">S</text>
  <text x="42" y="152" font-size="12" font-style="italic" fill="#333">i</text>
  <text x="52" y="148" font-size="16" fill="#333">, </text>
  <text x="62" y="148" font-size="16" font-style="italic" fill="#333">N</text>
  <text x="77" y="152" font-size="12" font-style="italic" fill="#333">i</text>
  <line x1="95" y1="145" x2="145" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- LNA (triangle) -->
  <polygon points="160,115 240,145 160,175" fill="none" stroke="#333" stroke-width="2.5"/>
  <!-- Squiggle inside LNA -->
  <path d="M175,140 Q182,128 190,140 Q198,152 205,140" fill="none" stroke="#333" stroke-width="1.8"/>
  <!-- LNA labels -->
  <text x="160" y="68" text-anchor="middle" font-size="14" fill="#333">Low noise</text>
  <text x="160" y="86" text-anchor="middle" font-size="14" fill="#333">amplifier</text>
  <!-- Parameters below -->
  <text x="175" y="210" font-size="15" font-style="italic" fill="#333">G</text>
  <text x="188" y="210" font-size="15" fill="#333"> = 10 dB</text>
  <text x="175" y="232" font-size="15" font-style="italic" fill="#333">F</text>
  <text x="185" y="232" font-size="15" fill="#333"> = 2 dB</text>

  <!-- LNA to BPF arrow -->
  <line x1="240" y1="145" x2="310" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- BPF (rectangle) -->
  <rect x="320" y="115" width="100" height="60" rx="3" fill="none" stroke="#333" stroke-width="2.5"/>
  <!-- Squiggle inside BPF -->
  <path d="M345,140 Q352,125 360,140 Q368,155 375,140 Q382,125 390,140" fill="none" stroke="#333" stroke-width="1.8"/>
  <!-- BPF labels -->
  <text x="370" y="68" text-anchor="middle" font-size="14" fill="#333">Bandpass</text>
  <text x="370" y="86" text-anchor="middle" font-size="14" fill="#333">filter</text>
  <!-- Parameters below -->
  <text x="345" y="210" font-size="15" font-style="italic" fill="#333">L</text>
  <text x="355" y="210" font-size="15" fill="#333"> = 1 dB</text>

  <!-- BPF to Mixer arrow -->
  <line x1="420" y1="145" x2="520" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Mixer (circle with X) -->
  <circle cx="560" cy="145" r="30" fill="none" stroke="#333" stroke-width="2.5"/>
  <line x1="539" y1="124" x2="581" y2="166" stroke="#333" stroke-width="2.2"/>
  <line x1="581" y1="124" x2="539" y2="166" stroke="#333" stroke-width="2.2"/>
  <!-- Mixer label -->
  <text x="560" y="78" text-anchor="middle" font-size="14" fill="#333">Mixer</text>
  <!-- Parameters below -->
  <text x="535" y="210" font-size="15" font-style="italic" fill="#333">L</text>
  <text x="545" y="210" font-size="15" fill="#333"> = 3 dB</text>
  <text x="535" y="232" font-size="15" font-style="italic" fill="#333">F</text>
  <text x="545" y="232" font-size="15" fill="#333"> = 4 dB</text>

  <!-- Mixer to output arrow -->
  <line x1="590" y1="145" x2="690" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output So, No -->
  <text x="705" y="148" font-size="16" font-style="italic" fill="#333">S</text>
  <text x="717" y="152" font-size="12" font-style="italic" fill="#333">o</text>
  <text x="727" y="148" font-size="16" fill="#333">, </text>
  <text x="737" y="148" font-size="16" font-style="italic" fill="#333">N</text>
  <text x="752" y="152" font-size="12" font-style="italic" fill="#333">o</text>
</svg>
