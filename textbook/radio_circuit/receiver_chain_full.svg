<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Georgia','Times New Roman',serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#333"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#2a6e5a"/>
    </marker>
  </defs>

  <!-- Background wavy line (noise source) -->
  <path d="M30,120 C30,130 20,140 20,150 C20,160 30,170 30,180 C30,190 20,200 20,210 C20,220 30,230 30,240 C30,250 20,260 20,270 C20,280 30,290 30,300 C30,310 20,320 20,330 C20,340 30,350 30,360 C30,370 20,380 20,390 C20,400 30,410 30,420" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Brace left -->
  <text x="42" y="170" font-size="14" fill="#333">{</text>
  <text x="50" y="155" font-size="15" fill="#333">Background</text>

  <!-- Tb label -->
  <text x="42" y="415" font-size="14" fill="#333">{</text>
  <text x="50" y="430" font-size="16" font-style="italic" fill="#333">T</text>
  <text x="62" y="434" font-size="12" font-style="italic" fill="#333">b</text>

  <!-- Si arrow into antenna -->
  <line x1="80" y1="280" x2="130" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="88" y="270" font-size="16" font-style="italic" fill="#333">S</text>
  <text x="100" y="274" font-size="12" font-style="italic" fill="#333">i</text>

  <!-- Antenna: converging lines (>) then ellipse (wave beam) -->
  <line x1="140" y1="258" x2="175" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="302" x2="175" y2="280" stroke="#333" stroke-width="2"/>
  <ellipse cx="210" cy="280" rx="25" ry="12" fill="none" stroke="#333" stroke-width="2"/>

  <!-- GA, ηrad, TP label above antenna (1.5x size, shifted left) -->
  <text x="100" y="240" font-size="22" font-style="italic" fill="#333">G</text>
  <text x="119" y="246" font-size="16" font-style="italic" fill="#333">A</text>
  <text x="133" y="240" font-size="22" fill="#333">, </text>
  <text x="145" y="240" font-size="22" font-style="italic" fill="#333">&#x3b7;</text>
  <text x="160" y="246" font-size="16" font-style="italic" fill="#333">rad</text>
  <text x="185" y="240" font-size="22" fill="#333">, </text>
  <text x="197" y="240" font-size="22" font-style="italic" fill="#333">T</text>
  <text x="214" y="246" font-size="16" font-style="italic" fill="#333">P</text>
  <text x="160" y="330" font-size="14" fill="#333">Antenna</text>

  <!-- Dashed line (antenna terminal) -->
  <line x1="270" y1="180" x2="270" y2="400" stroke="#333" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- Antenna to transmission line -->
  <line x1="235" y1="280" x2="260" y2="280" stroke="#333" stroke-width="2"/>
  <circle cx="252" cy="280" r="4" fill="white" stroke="#333" stroke-width="2"/>

  <!-- Transmission line -->
  <line x1="256" y1="280" x2="350" y2="280" stroke="#333" stroke-width="2"/>
  <circle cx="350" cy="280" r="4" fill="white" stroke="#333" stroke-width="2"/>
  <line x1="354" y1="280" x2="400" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Transmission line label -->
  <text x="280" y="260" font-size="15" font-style="italic" fill="#333">L</text>
  <text x="291" y="264" font-size="11" font-style="italic" fill="#333">T</text>
  <text x="300" y="260" font-size="15" fill="#333">, </text>
  <text x="308" y="260" font-size="15" font-style="italic" fill="#333">T</text>
  <text x="320" y="264" font-size="11" font-style="italic" fill="#333">P</text>
  <text x="272" y="320" font-size="14" fill="#333">Transmission</text>
  <text x="295" y="338" font-size="14" fill="#333">line</text>

  <!-- Ni, Si below dashed line -->
  <line x1="290" y1="355" x2="340" y2="355" stroke="#2a6e5a" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="290" y="380" font-size="15" font-style="italic" fill="#2a6e5a">N</text>
  <text x="303" y="384" font-size="11" font-style="italic" fill="#2a6e5a">i</text>
  <text x="312" y="380" font-size="15" fill="#2a6e5a">, </text>
  <text x="320" y="380" font-size="15" font-style="italic" fill="#2a6e5a">S</text>
  <text x="332" y="384" font-size="11" font-style="italic" fill="#2a6e5a">i</text>

  <!-- Receiver box -->
  <rect x="415" y="190" width="500" height="260" rx="3" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="610" y="470" font-size="16" font-weight="bold" fill="#333">Receiver</text>

  <!-- RF Amplifier (triangle) -->
  <polygon points="440,260 500,280 440,300" fill="none" stroke="#333" stroke-width="2"/>
  <text x="445" y="225" font-size="15" font-style="italic" fill="#333">G</text>
  <text x="458" y="229" font-size="11" font-style="italic" fill="#333">RF</text>
  <text x="445" y="245" font-size="15" font-style="italic" fill="#333">T</text>
  <text x="457" y="249" font-size="11" font-style="italic" fill="#333">RF</text>
  <text x="450" y="340" font-size="14" fill="#333">RF</text>
  <text x="445" y="358" font-size="14" fill="#333">Amp.</text>

  <!-- RF to Mixer arrow -->
  <line x1="500" y1="280" x2="560" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Mixer (circle with X) -->
  <circle cx="590" cy="280" r="25" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="572" y1="262" x2="608" y2="298" stroke="#333" stroke-width="2"/>
  <line x1="608" y1="262" x2="572" y2="298" stroke="#333" stroke-width="2"/>
  <!-- Mixer labels -->
  <text x="565" y="225" font-size="15" font-style="italic" fill="#333">L</text>
  <text x="577" y="229" font-size="11" font-style="italic" fill="#333">M</text>
  <text x="565" y="245" font-size="15" font-style="italic" fill="#333">T</text>
  <text x="577" y="249" font-size="11" font-style="italic" fill="#333">M</text>

  <!-- LO (local oscillator) -->
  <circle cx="590" cy="390" r="20" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Sine wave inside LO circle -->
  <path d="M575,390 Q582,378 590,390 Q598,402 605,390" fill="none" stroke="#333" stroke-width="2"/>
  <text x="575" y="430" font-size="14" fill="#333">LO</text>
  <!-- LO line + arrowhead pointing up into mixer -->
  <line x1="590" y1="370" x2="590" y2="310" stroke="#333" stroke-width="2"/>
  <polygon points="582,318 590,305 598,318" fill="#333"/>

  <!-- Mixer to IF Amp arrow -->
  <line x1="615" y1="280" x2="700" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- IF Amplifier (triangle) -->
  <polygon points="710,260 770,280 710,300" fill="none" stroke="#333" stroke-width="2"/>
  <text x="715" y="225" font-size="15" font-style="italic" fill="#333">G</text>
  <text x="728" y="229" font-size="11" font-style="italic" fill="#333">IF</text>
  <text x="715" y="245" font-size="15" font-style="italic" fill="#333">T</text>
  <text x="727" y="249" font-size="11" font-style="italic" fill="#333">IF</text>
  <text x="725" y="340" font-size="14" fill="#333">IF</text>
  <text x="715" y="358" font-size="14" fill="#333">Amp.</text>

  <!-- IF Amp to output arrow -->
  <line x1="770" y1="280" x2="920" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output labels No, So -->
  <text x="930" y="275" font-size="16" font-style="italic" fill="#333">N</text>
  <text x="945" y="279" font-size="12" font-style="italic" fill="#333">o</text>
  <text x="955" y="275" font-size="16" fill="#333">, </text>
  <text x="963" y="275" font-size="16" font-style="italic" fill="#333">S</text>
  <text x="976" y="279" font-size="12" font-style="italic" fill="#333">o</text>
</svg>
