<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="serif" font-size="28">
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2.5" fill="#333"/>
    </marker>
  </defs>

  <!-- Port 1 input line -->
  <line x1="20" y1="160" x2="120" y2="160" stroke="#333" stroke-width="2.5"/>
  <text x="10" y="145" font-size="26" fill="#333">Z₀</text>
  <circle cx="120" cy="160" r="4" fill="#333"/>
  <text x="108" y="150" font-size="32" font-weight="bold" fill="#1a1a8a">①</text>

  <!-- Upper arm (to port 2) -->
  <line x1="120" y1="160" x2="180" y2="80" stroke="#333" stroke-width="2.5"/>
  <line x1="180" y1="80" x2="340" y2="80" stroke="#333" stroke-width="2.5"/>
  <text x="230" y="70" font-size="26" fill="#333">λ/4</text>
  <circle cx="340" cy="80" r="4" fill="#333"/>
  <text x="328" y="68" font-size="32" font-weight="bold" fill="#1a1a8a">②</text>

  <!-- Lower arm (to port 3) -->
  <line x1="120" y1="160" x2="180" y2="240" stroke="#333" stroke-width="2.5"/>
  <line x1="180" y1="240" x2="340" y2="240" stroke="#333" stroke-width="2.5"/>
  <text x="230" y="260" font-size="26" fill="#333">λ/4</text>
  <circle cx="340" cy="240" r="4" fill="#333"/>
  <text x="328" y="270" font-size="32" font-weight="bold" fill="#1a1a8a">③</text>

  <!-- √2 Z₀ label on arms -->
  <text x="135" y="110" font-size="26" fill="#1a1a8a" transform="rotate(-35,135,110)">√2 Z₀</text>
  <text x="135" y="225" font-size="26" fill="#1a1a8a" transform="rotate(35,135,225)">√2 Z₀</text>

  <!-- Isolation resistor 2Z₀ (zigzag between port 2 and port 3) -->
  <polyline points="340,80 340,100 330,108 350,120 330,132 350,144 330,156 350,168 330,180 350,192 330,204 350,216 340,224 340,240"
    fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <text x="358" y="165" font-size="28" fill="#c00" font-weight="bold">2Z₀</text>

  <!-- Port 2 output line -->
  <line x1="340" y1="80" x2="440" y2="80" stroke="#333" stroke-width="2.5"/>
  <text x="395" y="85" font-size="26" fill="#333">Z₀</text>

  <!-- Port 3 output line -->
  <line x1="340" y1="240" x2="440" y2="240" stroke="#333" stroke-width="2.5"/>
  <text x="395" y="245" font-size="26" fill="#333">Z₀</text>

  <!-- Port 3 termination resistor (zigzag going down) -->
  <line x1="440" y1="240" x2="440" y2="255" stroke="#333" stroke-width="2"/>
  <polyline points="440,255 430,261 450,273 430,285 450,297 440,303"
    fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Ground symbol -->
  <line x1="430" y1="303" x2="450" y2="303" stroke="#333" stroke-width="2"/>
  <line x1="433" y1="307" x2="447" y2="307" stroke="#333" stroke-width="1.5"/>
  <line x1="436" y1="311" x2="444" y2="311" stroke="#333" stroke-width="1"/>
  <text x="455" y="285" font-size="26" fill="#333">Z₀</text>
</svg>
